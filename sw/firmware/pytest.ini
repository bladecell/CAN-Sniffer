[pytest]
testpaths = tests/rest_api
markers =
    integration: requires a reachable CAN Sniffer device
    sd_write: opt-in SD-card write/cleanup roundtrip (also requires CAN_SNIFFER_ENABLE_SD_WRITE=1)
    sd_mutating_security: potentially destructive POST/DELETE path probes; hardened firmware and explicit opt-in required
    pid_def_write: opt-in for every PID definition PUT/mutation safety test (also requires CAN_SNIFFER_ENABLE_PID_DEF_WRITE=1)
